<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="float-nav">
        <a href="#home">Home</a>
        <a href="#introduction">Intro</a>
        <a href="#authors">Team</a>
        <a href="#about">About</a>
        <a href="#objectives">Goals</a>
        <a href="#architecture">Architecture</a>
        <a href="#features">Features</a>
        <a href="#stack">Stack</a>
        <a href="#diagrams">Diagrams</a>
        <a href="#results">Results</a>
        <a href="#repo">Repo</a>
    </nav>

    <div class="main">
        <header id="home">
            <h1>P8 Project</h1>
            <p class="tagline">Immersive Experiences — Adaptive Multi-Agent Conversation in VR</p>
            <p class="meta-line">AAU Medialogy, 8th Semester · Continuation of P7</p>
        </header>

        <div class="content">
            <!-- Intro card: groups intro + authors + about + objectives in one panel -->
            <section class="description">
                <div data-include="sections/intro.html"></div>
                <div data-include="sections/authors.html"></div>
                <div data-include="sections/about.html"></div>
                <div data-include="sections/objectives.html"></div>
            </section>

            <section class="description" data-include="sections/architecture.html"></section>
            <section class="description" data-include="sections/features.html"></section>
            <section class="description" data-include="sections/stack.html"></section>
            <section class="description" data-include="sections/diagrams.html"></section>
            <section class="description" data-include="sections/results.html"></section>
            <section class="description" data-include="sections/repo.html"></section>
        </div>

        <footer>
            <p>AAU Medialogy · P8 · Draft page — content will be expanded as the project progresses.</p>
        </footer>
    </div>

    <script>
        // Load partial HTML files declared via [data-include="path"].
        // After load, re-jump to the URL hash so deep links still scroll into view.
        (async () => {
            const targets = document.querySelectorAll('[data-include]');
            await Promise.all([...targets].map(async (el) => {
                const path = el.getAttribute('data-include');
                try {
                    const res = await fetch(path);
                    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
                    el.innerHTML = await res.text();
                } catch (err) {
                    el.innerHTML = '<p class="todo"><em>Failed to load ' + path + ': ' + err.message + '</em></p>';
                }
            }));
            if (location.hash) {
                const target = document.querySelector(location.hash);
                if (target) target.scrollIntoView();
            }
        })();
    </script>
</body>
</html>
